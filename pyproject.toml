[project]
name = "bridge-builder"
version = "0.1.0"
description = "Workshop bridge game: pygame + Box2D, MCP, Jupyter"
requires-python = ">=3.12"
dependencies = [
  "pygame>=2.6",
  "Box2D==2.3.10",
  "mcp>=1.9",
  "notebook>=7.0",
  "ipykernel>=6.0",
]

[project.optional-dependencies]
dev = [
    "pip>=26.2.1",
    "pytest>=8.0",
]

[project.scripts]
bridge-builder = "bridge_builder.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bridge_builder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  "ignore:builtin type SwigPy:DeprecationWarning",
]
